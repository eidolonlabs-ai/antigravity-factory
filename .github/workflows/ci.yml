name: Software Factory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Factory Tests, Verification & Security Audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run factory CLI & hook unit tests
        run: npm test

      - name: Run deterministic verification on root workspace
        run: node bin/agy-factory.js verify --require-tests --github-summary

      - name: Run deterministic verification on Task Tracker example
        run: node bin/agy-factory.js verify --cwd examples/task-tracker --require-tests --github-summary

      - name: Run security & diff audit across repository
        run: node bin/agy-factory.js audit-diff --all --github-summary
